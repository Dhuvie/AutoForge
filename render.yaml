services:
  - type: web
    name: autoforge-ai
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: PORT
        value: 10000
    disk:
      name: sqlite-db
      mountPath: /var/data
      sizeGB: 1
